services:
  mysql:
    image: mysql:8.4
    container_name: duck-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: duckstore
    ports: ["3307:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      retries: 20
    volumes: [mysql_data:/var/lib/mysql]
volumes:
  mysql_data: {}